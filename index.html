<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>House Reno</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f7f3ed; color: #1c1710; min-height: 100vh;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  /* ── AUTH ── */
  #auth-screen {
    position: fixed; inset: 0; background: #f7f3ed; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #auth-screen h1 { font-family: 'DM Serif Display', serif; font-size: 32px; font-weight: 400; color: #1c1710; letter-spacing: -0.3px; }
  #auth-screen p  { font-size: 13px; color: #9a8870; margin-top: -10px; letter-spacing: 0.2px; }
  #auth-input {
    width: 260px; padding: 16px; border: 1.5px solid #ddd5c0; border-radius: 14px;
    font-size: 17px; background: #fff; outline: none; text-align: center;
    -webkit-appearance: none; font-family: inherit; color: #1c1710;
  }
  #auth-input:focus { border-color: #8a7a5e; }
  #auth-btn {
    width: 260px; padding: 15px; background: #1c1710; color: #f7f3ed; border: none;
    border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    letter-spacing: 0.1px;
  }
  #auth-btn:active { opacity: 0.85; }
  #auth-error { font-size: 13px; color: #c05030; }

  /* ── HEADER ── */
  #top-bar {
    position: sticky; top: 0; z-index: 100;
    background: #f2ede6; border-bottom: 1px solid #e0d8cc;
    padding: 14px 20px 0;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .header-title-group {}
  .header-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: #a89878; margin-bottom: 2px; }
  #top-bar h1 { font-family: 'DM Serif Display', serif; font-size: 24px; font-weight: 400; color: #1c1710; letter-spacing: -0.2px; }
  .budget-pill-header {
    background: #1c1710; color: #f7f3ed;
    padding: 6px 13px; border-radius: 20px; font-size: 11px; font-weight: 500;
    display: flex; gap: 6px; align-items: center; white-space: nowrap; margin-top: 4px;
    font-family: 'DM Sans', sans-serif;
  }
  .budget-pill-spent { color: #e8c870; font-weight: 600; }

  /* ── DESKTOP TABS ── */
  #desktop-tabs { display: flex; gap: 0; }
  @media (max-width: 640px) { #desktop-tabs { display: none; } }
  .dtab {
    padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
    border: none; background: transparent; color: #a89878; white-space: nowrap;
    border-bottom: 2px solid transparent; transition: all 0.15s; font-family: inherit;
  }
  .dtab:hover { color: #1c1710; }
  .dtab.active { color: #1c1710; border-bottom-color: #1c1710; font-weight: 600; }

  /* ── ROOM CHIPS ── */
  .room-bar {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding-bottom: 12px;
  }
  .room-bar::-webkit-scrollbar { display: none; }
  .room-btn {
    padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1.5px solid #d8cebc; background: transparent;
    color: #9a8870; white-space: nowrap; transition: all 0.15s; font-family: inherit;
  }
  .room-btn:hover { color: #1c1710; border-color: #b0a080; }
  .room-btn.active { background: #1c1710; color: #f7f3ed; border-color: #1c1710; }

  /* ── STATS ── */
  .stats-wrap { padding: 14px 20px 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: #fff; border-radius: 12px; padding: 11px 8px; text-align: center; border: 1px solid #e8e0d4; }
  .stat .num { font-family: 'DM Serif Display', serif; font-size: 24px; font-weight: 400; color: #1c1710; }
  .stat .lbl { font-size: 10px; font-weight: 600; color: #a89878; margin-top: 2px; letter-spacing: 0.4px; text-transform: uppercase; }

  /* ── BUDGET CARD ── */
  .budget-card {
    margin: 12px 20px 0; background: #fff; border: 1px solid #e8e0d4;
    border-radius: 14px; padding: 14px 16px;
  }
  .budget-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
  .budget-title  { font-size: 12px; font-weight: 600; color: #1c1710; letter-spacing: 0.2px; }
  .budget-nums   { font-size: 12px; color: #9a8870; }
  .budget-nums strong { color: #1c1710; }
  .budget-track  { height: 4px; background: #ede7db; border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .budget-fill   { height: 100%; background: #1c1710; border-radius: 2px; transition: width 0.4s; }
  .budget-fill.warn { background: #c8820; }
  .budget-fill.over { background: #c03020; }
  .budget-rooms  { display: flex; flex-wrap: wrap; gap: 6px; }
  .budget-room   { font-size: 11px; color: #8a7a60; background: #f5f0e6; border-radius: 8px; padding: 3px 9px; border: 1px solid #e0d8c8; }
  .budget-room span { font-weight: 600; color: #1c1710; }

  /* ── DECISION BANNER ── */
  #decision-banner {
    margin: 12px 20px 0; padding: 12px 16px;
    background: #fef9e8; border: 1.5px solid #e8d060; border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    transition: background 0.15s;
  }
  #decision-banner:hover { background: #fef5d8; }
  .dbanner-left { display: flex; align-items: center; gap: 10px; }
  .dbanner-text { font-size: 13px; font-weight: 600; color: #6a5010; }
  .dbanner-sub  { font-size: 11px; color: #9a7820; margin-top: 1px; }
  .dbanner-arrow { font-size: 18px; color: #b09030; }

  /* ── LEGEND ── */
  .legend {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 20px 0; font-size: 11px; color: #9a8870;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 10px; color: #c8b89a; margin-left: auto; }

  /* ── CONTENT ── */
  .content { padding: 8px 20px 40px; }

  /* ── PHASE HEADERS ── */
  .phase {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #a89878; margin: 22px 0 8px; padding-bottom: 8px;
    border-bottom: 1px solid #e8e0d4;
  }
  .phase-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-active { background: #e8a030; }
  .dot-urgent { background: #d85030; }
  .dot-p1     { background: #5a90d4; }
  .dot-p2     { background: #9060c8; }
  .dot-p3     { background: #40aa70; }
  .dot-decor  { background: #c8607a; }
  .dot-need   { background: #d85030; }
  .dot-want   { background: #5a90d4; }
  .dot-qs     { background: #d8a020; }

  /* ── ITEMS ── */
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item {
    background: #fff; border: 1px solid #e8e0d4; border-radius: 14px;
    padding: 13px 14px; display: flex; align-items: flex-start; gap: 10px;
    transition: all 0.15s; box-shadow: 0 1px 4px rgba(28,23,16,0.04);
  }
  .item:hover   { border-color: #c8bca8; box-shadow: 0 2px 12px rgba(28,23,16,0.08); transform: translateY(-1px); }
  .item.done    { opacity: 0.35; }
  .item.blocked { border-color: #e8d060; background: #fffef4; }

  /* ── STATUS BTN ── */
  .status-btn {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #d8cebc;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; transition: all 0.15s;
    background: #faf8f4; color: #c0b09a; font-family: inherit;
  }
  .status-btn:hover { border-color: #9a8870; color: #9a8870; }
  .s-none    { border-color: #ddd5c0; color: #c8b8a0; background: #faf8f4; }
  .s-active  { border-color: #c8a020; color: #8a6010; background: #fff8e0; }
  .s-waiting { border-color: #90aad0; color: #3060a0; background: #eef2f8; }
  .s-done    { border-color: #70b050; color: #3a7020; background: #eef8e8; }

  /* ── ITEM BODY ── */
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; font-weight: 500; color: #1c1710; line-height: 1.3; }
  .item-note { font-size: 12px; color: #9a8870; margin-top: 3px; line-height: 1.4; }
  .item-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 10px; font-weight: 500; border: 1px solid transparent; }
  .tag.room   { background: #f5f0e6; color: #8a7a60; border-color: #e0d8c8; }
  .tag.need   { background: #fde8e0; color: #a04030; border-color: #f0c0a8; }
  .tag.want   { background: #eaeff8; color: #3060a0; border-color: #c0ccec; }
  .tag.urgent { background: #fff0e4; color: #a05010; border-color: #f0d090; }
  .tag.active { background: #fef8e0; color: #8a5010; border-color: #e8c060; }
  .tag.cost   { background: #f0f8ea; color: #3a7020; border-color: #bcd8a8; }

  /* ── BLOCKER BADGES ── */
  .blockers-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .blocker-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; padding: 3px 8px; border-radius: 8px; font-weight: 500;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .blocker-task { background: #fff0e0; color: #804020; border: 1px solid #f0c890; }
  .blocker-q    { background: #fef8d8; color: #806010; border: 1px solid #e8d060; }

  /* ── URL ── */
  .url-area { margin-top: 6px; }
  .url-link { font-size: 12px; color: #5a8fd4; text-decoration: none; }
  .url-link:hover { color: #2860a8; }
  .add-url { font-size: 12px; color: #c8b89a; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; transition: color 0.15s; }
  .add-url:hover { color: #8a7a5e; }
  .url-wrap { display: flex; gap: 6px; margin-top: 4px; }
  .url-inp { background: #f8f4ec; border: 1.5px solid #d8cebc; border-radius: 7px; padding: 5px 10px; font-size: 12px; color: #1c1710; flex: 1; outline: none; font-family: inherit; }
  .url-inp:focus { border-color: #8a7a5e; }
  .url-save-btn { background: #1c1710; border: none; border-radius: 7px; padding: 5px 12px; font-size: 12px; color: #f7f3ed; cursor: pointer; font-family: inherit; }

  /* ── DRAWER ── */
  #drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.22s;
  }
  #drawer-overlay.open { opacity: 1; pointer-events: all; }
  #drawer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 160;
    background: #f7f3ed; border-radius: 22px 22px 0 0;
    max-height: 88vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0,0.15,1);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 40px rgba(28,23,16,0.14);
  }
  #drawer.open { transform: translateY(0); }
  @media (min-width: 641px) {
    #drawer { max-width: 540px; left: 50%; right: auto; transform: translateX(-50%) translateY(100%); border-radius: 22px 22px 0 0; }
    #drawer.open { transform: translateX(-50%) translateY(0); }
  }
  .drawer-handle { width: 36px; height: 3px; background: #d8cebc; border-radius: 2px; margin: 12px auto 4px; flex-shrink: 0; }
  .drawer-header {
    padding: 10px 18px 14px; border-bottom: 1px solid #e8e0d4;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0;
  }
  .drawer-title-wrap { flex: 1; }
  .drawer-title { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; color: #1c1710; line-height: 1.3; }
  .drawer-subtitle { font-size: 11px; color: #9a8870; margin-top: 2px; letter-spacing: 0.3px; text-transform: uppercase; font-weight: 600; }
  .drawer-close {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: #ede7db; color: #8a7a5e; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: inherit; font-weight: 700; line-height: 1; transition: background 0.15s;
  }
  .drawer-close:hover { background: #ddd5c8; }
  .drawer-body { overflow-y: auto; padding: 16px 18px 32px; flex: 1; background: #f7f3ed; }
  .drawer-section { margin-bottom: 20px; }
  .drawer-section:last-child { margin-bottom: 0; }
  .drawer-section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #a89878; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .drawer-section-label::after { content: ""; flex: 1; height: 1px; background: #e8e0d4; }
  .drawer-text { font-size: 14px; color: #1c1710; line-height: 1.6; }
  .drawer-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0; }
  .drawer-list li {
    font-size: 13px; color: #1c1710; line-height: 1.5; padding: 7px 0;
    border-bottom: 1px solid #e8e0d4; display: flex; gap: 8px; align-items: flex-start;
  }
  .drawer-list li:last-child { border-bottom: none; padding-bottom: 0; }
  .drawer-list li::before { content: "—"; color: #c8b89a; flex-shrink: 0; margin-top: 1px; }
  .drawer-links { display: flex; flex-direction: column; gap: 8px; }
  .drawer-link {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: #fff; border: 1px solid #e0d8cc; border-radius: 12px;
    text-decoration: none; color: #4a7ab0; font-size: 13px; font-weight: 500; transition: all 0.15s;
  }
  .drawer-link:hover { background: #f5f0e6; border-color: #c8bca8; }
  .drawer-link-icon { font-size: 16px; }
  .drawer-empty { font-size: 13px; color: #b0a080; padding: 12px 0; }
  /* Notes + user links editing */
  .drawer-textarea {
    width: 100%; min-height: 80px; padding: 10px 12px;
    border: 1.5px solid #d8cebc; border-radius: 10px;
    font-size: 13px; color: #1c1710; background: #fff;
    font-family: inherit; line-height: 1.5; resize: vertical; outline: none;
  }
  .drawer-textarea:focus { border-color: #9a8870; }
  .drawer-save-note {
    margin-top: 6px; padding: 7px 16px; background: #1c1710; border: none;
    border-radius: 8px; font-size: 12px; color: #f7f3ed; cursor: pointer;
    font-family: inherit; font-weight: 600; transition: opacity 0.15s;
  }
  .drawer-save-note:hover { opacity: 0.85; }
  .drawer-save-note.saved { background: #4a8030; }
  .ulink-row { display: flex; gap: 6px; margin-top: 6px; }
  .ulink-inp {
    flex: 1; padding: 8px 10px; border: 1.5px solid #d8cebc; border-radius: 8px;
    font-size: 12px; background: #fff; outline: none; font-family: inherit; color: #1c1710;
  }
  .ulink-inp:focus { border-color: #9a8870; }
  .ulink-label-inp {
    width: 110px; padding: 8px 10px; border: 1.5px solid #d8cebc; border-radius: 8px;
    font-size: 12px; background: #fff; outline: none; font-family: inherit; color: #1c1710;
  }
  .ulink-label-inp:focus { border-color: #9a8870; }
  .ulink-add-btn {
    padding: 8px 14px; background: #1c1710; border: none; border-radius: 8px;
    font-size: 12px; color: #f7f3ed; cursor: pointer; font-family: inherit; font-weight: 600;
    white-space: nowrap;
  }
  .ulink-add-btn:hover { opacity: 0.85; }
  .ulink-existing { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .ulink-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    background: #fff; border: 1px solid #e0d8cc; border-radius: 10px;
  }
  .ulink-item a { flex: 1; font-size: 13px; color: #4a7ab0; text-decoration: none; word-break: break-all; }
  .ulink-item a:hover { text-decoration: underline; }
  .ulink-del {
    background: none; border: none; color: #c09070; cursor: pointer;
    font-size: 15px; padding: 0 2px; line-height: 1; flex-shrink: 0;
  }
  .ulink-del:hover { color: #c03020; }
  /* Edit mode */
  .drawer-edit-btn {
    padding: 5px 12px; background: transparent; border: 1.5px solid #d8cebc;
    border-radius: 8px; font-size: 12px; color: #8a7a5e; cursor: pointer;
    font-family: inherit; font-weight: 500; transition: all 0.15s; white-space: nowrap;
  }
  .drawer-edit-btn:hover { border-color: #8a7a5e; color: #2c2416; }
  .drawer-edit-btn.editing { background: #2c2416; border-color: #2c2416; color: #f5f0e8; }
  .edit-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 14px 16px; background: #fff; border: 1px solid #e0d8cc; border-radius: 12px; }
  .edit-field { display: flex; flex-direction: column; gap: 4px; }
  .edit-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a89878; }
  .edit-inp {
    padding: 9px 12px; border: 1.5px solid #d8cebc; border-radius: 8px;
    font-size: 13px; color: #1c1710; background: #fff; outline: none; font-family: inherit;
  }
  .edit-inp:focus { border-color: #9a8870; }
  .edit-actions { display: flex; gap: 8px; margin-top: 2px; }
  .edit-save {
    flex: 1; padding: 9px; background: #1c1710; border: none; border-radius: 8px;
    font-size: 13px; color: #f7f3ed; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .edit-save:hover { opacity: 0.87; }
  .edit-cancel {
    padding: 9px 16px; background: transparent; border: 1.5px solid #d8cebc; border-radius: 8px;
    font-size: 13px; color: #9a8870; cursor: pointer; font-family: inherit;
  }
  .edit-cancel:hover { border-color: #9a8870; }
  /* make item bodies look tappable */
  .item-body { cursor: pointer; }
  .item-body:hover .item-name { color: #5a4a20; }
  .item-chevron { font-size: 13px; color: #c8b89a; margin-left: auto; flex-shrink: 0; padding-left: 4px; }
  /* ── DECISION CARDS ── */
  .decision-card {
    background: #fff8e0; border: 1.5px solid #f0d880; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .decision-card.resolved { background: #f0f8ea; border-color: #b8d898; }
  .decision-q      { font-size: 14px; font-weight: 700; color: #1e1a10; margin-bottom: 6px; line-height: 1.3; }
  .decision-blocks { font-size: 11px; color: #8a7a5e; margin-bottom: 10px; line-height: 1.5; }
  .decision-blocks strong { color: #5a4a20; }
  .decision-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .dec-opt {
    padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1.5px solid #d4c890; background: #fff; color: #5a4a20;
    transition: all 0.15s; font-family: inherit;
  }
  .dec-opt:hover { background: #f8ea40; border-color: #c0a820; }
  .dec-custom-wrap { display: flex; gap: 6px; }
  .dec-custom-inp {
    flex: 1; padding: 7px 10px; border: 1.5px solid #d4c890; border-radius: 10px;
    font-size: 12px; background: #fff; outline: none; font-family: inherit; color: #2c2416;
  }
  .dec-custom-inp:focus { border-color: #a08030; }
  .dec-save {
    padding: 7px 14px; background: #2c2416; border: none; border-radius: 10px;
    font-size: 12px; color: #f5f0e8; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .dec-decided-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .dec-decided { font-size: 13px; color: #3a7020; font-weight: 600; }
  .dec-decided::before { content: "✓ "; }
  .dec-revisit { font-size: 11px; color: #8a7a5e; cursor: pointer; background: none; border: none; font-family: inherit; text-decoration: underline; padding: 0; }

  /* ── EMPTY ── */
  .empty { color: #b0a080; font-size: 14px; padding: 40px 0; text-align: center; }

  /* ── BOTTOM NAV ── */
  #bottom-nav {

function getQDecision(qid) { return qdecision[qid] || null; }

function cycleStatus(id) {
  const cur = getStatus(id);
  status[id] = STATUSES[(STATUSES.indexOf(cur) + 1) % STATUSES.length];
  save(); render();
}
function decideQ(qid, answer) { qdecision[qid] = answer; save(); render(); }
function undecideQ(qid)       { delete qdecision[qid];   save(); render(); }

function save() {
  localStorage.setItem("reno_urls",      JSON.stringify(urls));
  localStorage.setItem("reno_status",    JSON.stringify(status));
  localStorage.setItem("reno_qdecision", JSON.stringify(qdecision));
  localStorage.setItem("reno_notes",     JSON.stringify(userNotes));
  localStorage.setItem("reno_ulinks",    JSON.stringify(userLinks));
  localStorage.setItem("reno_edits",     JSON.stringify(userEdits));
}

// Returns all blockers for an item: task blockers + open question blockers
function getBlockers(item) {
  const taskBlockers = (item.blockedBy || [])
    .filter(bid => !isDone(bid))
    .map(bid => {
      const found = DATA.find(d => d.id === bid);
      return { type: "task", label: found ? found.name : "?" };
    });
  const qBlockers = QUESTIONS
    .filter(q => !getQDecision(q.qid) && q.blocksItems.includes(item.id))
    .map(q => ({ type: "q", label: q.text }));
  return [...taskBlockers, ...qBlockers];
}

// ── BUDGET ────────────────────────────────────────────────────────────────────
const fmt = n => n >= 1000 ? `$${(n / 1000).toFixed(n % 1000 === 0 ? 0 : 1)}k` : `$${n}`;

function budgetByRoom() {
  const rooms = {};
  DATA.forEach(i => {
    const est = (userEdits[i.id] || {}).est ?? i.est;
    if (!est || est === 0) return;
    if (!rooms[i.room]) rooms[i.room] = { est: 0, spent: 0 };
    rooms[i.room].est += est;
    if (isDone(i.id)) rooms[i.room].spent += est;
  });
  return rooms;
}

function renderBudgetCard() {
  const totalEst  = DATA.reduce((s, i) => s + (((userEdits[i.id] || {}).est ?? i.est) || 0), 0);
  const totalDone = DATA.filter(i => isDone(i.id)).reduce((s, i) => s + (i.est || 0), 0);
  const pct = Math.min(100, (totalEst / BUDGET) * 100);
  const cls = totalEst > BUDGET ? "over" : totalEst > BUDGET * 0.85 ? "warn" : "";
  const rooms = budgetByRoom();
  const chips = Object.entries(rooms).sort((a, b) => b[1].est - a[1].est)
    .map(([r, v]) => `<div class="budget-room">${ROOM_LABELS[r] || r}: <span>${fmt(v.est)}</span></div>`)
    .join("");
  return `<div class="budget-card">
    <div class="budget-header">
      <div class="budget-title">Budget</div>
      <div class="budget-nums">Spent <strong>${fmt(totalDone)}</strong> · Est <strong>${fmt(totalEst)}</strong> / <strong>$60k</strong></div>
    </div>
    <div class="budget-track"><div class="budget-fill ${cls}" style="width:${pct}%"></div></div>
    <div class="budget-rooms">${chips}</div>
  </div>`;
}

// ── DECISION BANNER ───────────────────────────────────────────────────────────
function renderDecisionBanner() {
  const banner  = document.getElementById("decision-banner");
  const openQs  = QUESTIONS.filter(q => !getQDecision(q.qid));
  if (!openQs.length || activeTab === "decisions") { banner.style.display = "none"; return; }

  // Count all blocked items (from open questions + unfinished task deps)
  const blockedIds = new Set();
  DATA.forEach(item => {
    if (getBlockers(item).length > 0 && !isDone(item.id)) blockedIds.add(item.id);
  });

  banner.style.display = "flex";
  banner.innerHTML = `
    <div class="dbanner-left">
      <div style="font-size:18px">❓</div>
      <div>
        <div class="dbanner-text">${openQs.length} open decision${openQs.length !== 1 ? "s" : ""} · ${blockedIds.size} item${blockedIds.size !== 1 ? "s" : ""} blocked</div>
        <div class="dbanner-sub">Tap to review and decide</div>
      </div>
    </div>
    <div class="dbanner-arrow">›</div>`;
}

// ── DECISIONS TAB ─────────────────────────────────────────────────────────────
function renderDecisionsTab() {
  const openQs     = QUESTIONS.filter(q => !getQDecision(q.qid));
  const resolvedQs = QUESTIONS.filter(q =>  getQDecision(q.qid));
  let html = "";

  if (openQs.length) {
    html += `<div class="phase"><div class="phase-dot dot-qs"></div>Open — Needs a Decision</div>`;
    html += openQs.map(q => {
      const blockNames = q.blocksItems
        .map(id => (DATA.find(d => d.id === id) || {}).name)
        .filter(Boolean);
      return `<div class="decision-card" id="qcard-${q.qid}">
        <div class="decision-q">${q.text}</div>
        ${q.note ? `<div class="decision-blocks">${q.note}</div>` : ""}
        ${blockNames.length ? `<div class="decision-blocks">Blocks: <strong>${blockNames.join(", ")}</strong></div>` : ""}
        <div class="decision-options">
          ${q.options.map(o => `<button class="dec-opt" data-qid="${q.qid}" data-ans="${o}">${o}</button>`).join("")}
        </div>
        <div class="dec-custom-wrap">
          <input class="dec-custom-inp" id="dec-inp-${q.qid}" placeholder="Or type your decision…" />
          <button class="dec-save" data-qid="${q.qid}">Save</button>
        </div>
      </div>`;
    }).join("");
  }

  if (resolvedQs.length) {
    html += `<div class="phase"><div class="phase-dot" style="background:#80c060"></div>Decided</div>`;
    html += resolvedQs.map(q => `
      <div class="decision-card resolved" id="qcard-${q.qid}">
        <div class="decision-q">${q.text}</div>
        <div class="dec-decided-row">
          <div class="dec-decided">${getQDecision(q.qid)}</div>
          <button class="dec-revisit" data-qid="${q.qid}">Revisit</button>
        </div>
      </div>`).join("");
  }

  if (!openQs.length && !resolvedQs.length) {
    html = `<p class="empty">No decisions tracked yet.</p>`;
  }

  document.getElementById("list").innerHTML = html;
  document.getElementById("empty").style.display = "none";

  // Attach decision handlers
  document.querySelectorAll(".dec-opt").forEach(btn =>
    btn.addEventListener("click", () => decideQ(+btn.dataset.qid, btn.dataset.ans)));
  document.querySelectorAll(".dec-save").forEach(btn =>
    btn.addEventListener("click", () => {
      const inp = document.getElementById(`dec-inp-${btn.dataset.qid}`);
      if (inp && inp.value.trim()) decideQ(+btn.dataset.qid, inp.value.trim());
    }));
  document.querySelectorAll(".dec-custom-inp").forEach(inp =>
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && inp.value.trim()) {
        const qid = inp.id.replace("dec-inp-", "");
        decideQ(+qid, inp.value.trim());
      }
    }));
  document.querySelectorAll(".dec-revisit").forEach(btn =>
    btn.addEventListener("click", () => undecideQ(+btn.dataset.qid)));
}

// ── RENDER ────────────────────────────────────────────────────────────────────
let activeTab  = "all";
let activeRoom = "all";

function render() {
  document.getElementById("budget-wrap").innerHTML = renderBudgetCard();
  renderDecisionBanner();

  if (activeTab === "decisions") {
    renderDecisionsTab();
    return;
  }

  const items = DATA.filter(i => {
    const tabOk  = activeTab === "all" || activeTab === "budget" || i.type === activeTab;
    const roomOk = activeRoom === "all" || i.room === activeRoom;
    return tabOk && roomOk;
  });

  // Stats
  const scope   = activeTab === "budget" ? DATA.filter(i => activeRoom === "all" || i.room === activeRoom) : items;
  const inprog  = scope.filter(i => getStatus(i.id) === "active").length;
  const waiting = scope.filter(i => getStatus(i.id) === "waiting").length;
  const doneN   = scope.filter(i => isDone(i.id)).length;
  const rem     = scope.length - doneN;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${rem}</div><div class="lbl">Remaining</div></div>
    <div class="stat"><div class="num">${inprog}</div><div class="lbl">Active</div></div>
    <div class="stat"><div class="num">${waiting}</div><div class="lbl">Waiting</div></div>
    <div class="stat"><div class="num">${doneN}</div><div class="lbl">Done</div></div>`;

  // Budget tab
  if (activeTab === "budget") {
    const rooms = budgetByRoom();
    let html = "";
    Object.entries(rooms).sort((a, b) => b[1].est - a[1].est).forEach(([room, v]) => {
      const ri = DATA.filter(i => i.room === room && i.est && i.est > 0);
      html += `<div class="phase"><div class="phase-dot" style="background:#8a7a5e"></div>${ROOM_LABELS[room]||room} — ${fmt(v.est)}</div>`;
      html += `<div class="items">${ri.map(renderItem).join("")}</div>`;
    });
    document.getElementById("list").innerHTML = html || `<p class="empty">No estimated costs yet.</p>`;
    document.getElementById("empty").style.display = "none";
    attachHandlers(); return;
  }

  if (!items.length) {
    document.getElementById("list").innerHTML = "";
    document.getElementById("empty").style.display = "block";
    return;
  }
  document.getElementById("empty").style.display = "none";

  let html = "";
  if (activeTab === "todo" || activeTab === "all") {
    const todos = items.filter(i => i.type === "todo");
    ["active","urgent","phase1","phase2","phase3","decor"].forEach(g => {
      const gi = todos.filter(i => i.group === g);
      if (!gi.length) return;
      const gd = GROUPS[g];
      html += `<div class="phase"><div class="phase-dot ${gd.dot}"></div>${gd.label}</div>`;
      html += `<div class="items">${gi.map(renderItem).join("")}</div>`;
    });
  }
  if (activeTab === "tobuy" || activeTab === "all") {
    ["need","want"].forEach(tier => {
      const ti = items.filter(i => i.type === "tobuy" && i.tier === tier);
      if (!ti.length) return;
      html += `<div class="phase"><div class="phase-dot ${GROUPS[tier].dot}"></div>${GROUPS[tier].label}</div>`;
      html += `<div class="items">${ti.map(renderItem).join("")}</div>`;
    });
  }
  document.getElementById("list").innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll(".status-btn").forEach(el =>
    el.addEventListener("click", () => cycleStatus(+el.dataset.id)));
  document.querySelectorAll(".add-url").forEach(el =>
    el.addEventListener("click", () => showUrlInput(+el.dataset.id)));
  document.querySelectorAll(".url-save-btn").forEach(el =>
    el.addEventListener("click", () => saveUrl(+el.dataset.id)));
  attachBodyHandlers();
}

function renderItem(item) {
  const st       = getStatus(item.id);
  const isDoneI  = st === "done";
  const itemUrl  = urls[item.id] || item.url || "";
  const blockers = getBlockers(item);
  const isBlocked = blockers.length > 0 && !isDoneI;
  const hasDetail = !!DETAILS[item.id];
  const edits    = userEdits[item.id] || {};
  const name     = edits.name ?? item.name;
  const note     = edits.note ?? item.note ?? "";
  const est      = edits.est  ?? item.est;

  const tags = [
    `<span class="tag room">${ROOM_LABELS[item.room]}</span>`,
    item.tier === "need"       ? `<span class="tag need">Need It</span>`    : "",
    item.tier === "want"       ? `<span class="tag want">Want It</span>`    : "",
    item.priority === "urgent" ? `<span class="tag urgent">This Week</span>`: "",
    item.priority === "active" ? `<span class="tag active">Active</span>`   : "",
    item.est && item.est > 0   ? `<span class="tag cost">${fmt(est)}</span>` : "",
  ].filter(Boolean).join("");

  const blockersHtml = isBlocked ? `
    <div class="blockers-row">
      ${blockers.map(b => `<span class="blocker-badge ${b.type === "task" ? "blocker-task" : "blocker-q"}">
        ${b.type === "task" ? "🔒" : "❓"} ${b.label}
      </span>`).join("")}
    </div>` : "";

  return `<div class="item${isDoneI ? " done" : ""}${isBlocked ? " blocked" : ""}" style="display:flex;align-items:flex-start;gap:10px;">
    <button class="status-btn ${STATUS_CLS[st]}" data-id="${item.id}" title="${STATUS_LBL[st]}">${STATUS_ICON[st]}</button>
    <div class="item-body" data-id="${item.id}" style="flex:1;min-width:0;">
      <div style="display:flex;align-items:flex-start;gap:4px;">
        <div class="item-name" style="flex:1;">${name}</div>
        ${hasDetail ? `<span class="item-chevron">›</span>` : ""}
      </div>
      ${note ? `<div class="item-note">${note}</div>` : ""}
      <div class="item-tags">${tags}</div>
      ${blockersHtml}
      ${item.type === "tobuy" ? `<div class="url-area" id="url-${item.id}">
        ${itemUrl
          ? `<a class="url-link" href="${itemUrl}" target="_blank">↗ ${itemUrl.replace(/^https?:\/\//,"").split("/")[0]}</a>`
          : `<button class="add-url" data-id="${item.id}">+ Add link</button>`}
      </div>` : ""}
    </div>
  </div>`;
}

function showUrlInput(id) {
  const area = document.getElementById(`url-${id}`);
  area.innerHTML = `<div class="url-wrap">
    <input class="url-inp" id="ui-${id}" type="url" placeholder="https://..." />
    <button class="url-save-btn" data-id="${id}">Save</button>
  </div>`;
  const inp = document.getElementById(`ui-${id}`);
  inp.focus();
  area.querySelector(".url-save-btn").addEventListener("click", () => saveUrl(id));
  inp.addEventListener("keydown", e => { if (e.key === "Enter") saveUrl(id); });
}

function saveUrl(id) {
  const inp = document.getElementById(`ui-${id}`);
  if (inp?.value.trim()) { urls[id] = inp.value.trim(); save(); render(); }
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".nav-tab").forEach(x => x.classList.toggle("active", x.dataset.tab === tab));
  document.querySelectorAll(".dtab").forEach(x    => x.classList.toggle("active", x.dataset.tab === tab));
  // Hide room filter on Decisions and Budget tabs
  document.getElementById("roomBar").style.display = (tab === "decisions" || tab === "budget") ? "none" : "flex";
  render();
}

document.getElementById("bottom-nav").addEventListener("click", e => {
  const t = e.target.closest(".nav-tab"); if (t) switchTab(t.dataset.tab);
});
document.getElementById("desktop-tabs").addEventListener("click", e => {
  const t = e.target.closest(".dtab"); if (t) switchTab(t.dataset.tab);
});
document.getElementById("roomBar").addEventListener("click", e => {
  const b = e.target.closest(".room-btn"); if (!b) return;
  activeRoom = b.dataset.room;
  document.querySelectorAll(".room-btn").forEach(x => x.classList.toggle("active", x === b));
  render();
});

// ── DRAWER ────────────────────────────────────────────────────────────────────
function openDrawer(id) {
  const item = DATA.find(d => d.id === id);
  if (!item) return;
  const detail = DETAILS[id] || {};
  const { measurements = [], decisions = [], research = [], links = [] } = detail;

  document.getElementById("drawer-title").textContent = item.name;
  document.getElementById("drawer-subtitle").textContent = ROOM_LABELS[item.room] || "";

  // Wire Edit button
  const editBtn = document.getElementById("drawer-edit-btn");
  let editMode = false;
  editBtn.addEventListener("click", () => {
    editMode = !editMode;
    editBtn.textContent = editMode ? "Done" : "Edit";
    editBtn.classList.toggle("editing", editMode);
    if (editMode) showEditForm(id);
    else           removeEditForm();
  });

  let html = "";

  if (decisions.length) {
    html += `<div class="drawer-section">
      <div class="drawer-section-label">✓ Decisions & Confirmed</div>
      <ul class="drawer-list">${decisions.map(d => `<li>${d}</li>`).join("")}</ul>
    </div>`;
  }

  if (measurements.length) {
    html += `<div class="drawer-section">
      <div class="drawer-section-label">📐 Measurements</div>
      <ul class="drawer-list">${measurements.map(m => `<li>${m}</li>`).join("")}</ul>
    </div>`;
  }

  if (research.length) {
    html += `<div class="drawer-section">
      <div class="drawer-section-label">🔍 Research</div>
      <ul class="drawer-list">${research.map(r => `<li>${r}</li>`).join("")}</ul>
    </div>`;
  }

  const allLinks = [...links];
  const itemUrl = urls[id] || item.url || "";
  if (itemUrl && !allLinks.find(l => l.url === itemUrl)) {
    allLinks.unshift({ label: itemUrl.replace(/^https?:\/\//, "").split("/")[0], url: itemUrl });
  }
  if (allLinks.length) {
    html += `<div class="drawer-section">
      <div class="drawer-section-label">🔗 Links</div>
      <div class="drawer-links">${allLinks.map(l =>
        `<a class="drawer-link" href="${l.url}" target="_blank">
          <span class="drawer-link-icon">↗</span><span>${l.label}</span>
        </a>`).join("")}
      </div>
    </div>`;
  }

  const blockers = getBlockers(item);
  if (blockers.length) {
    html += `<div class="drawer-section">
      <div class="drawer-section-label">🔒 Blocked By</div>
      <ul class="drawer-list">${blockers.map(b => `<li>${b.label}</li>`).join("")}</ul>
    </div>`;
  }

  if (!html) {
    html = `<p class="drawer-empty">No additional details yet. Hermes will add research, measurements, and links here as you work through this item.</p>`;
  }

  // ── User Notes (editable) ──
  const savedNote = userNotes[id] || "";
  html += `<div class="drawer-section">
    <div class="drawer-section-label">📝 My Notes</div>
    <textarea class="drawer-textarea" id="drawer-note-${id}" placeholder="Add your own notes here…">${savedNote}</textarea>
    <button class="drawer-save-note" id="drawer-note-btn-${id}">Save Note</button>
  </div>`;

  // ── User Links (editable) ──
  const savedLinks = userLinks[id] || [];
  const ulinkItems = savedLinks.length ? `<div class="ulink-existing" id="ulink-list-${id}">
    ${savedLinks.map((l, i) => `<div class="ulink-item" data-idx="${i}">
      <a href="${l.url}" target="_blank">${l.label || l.url}</a>
      <button class="ulink-del" data-id="${id}" data-idx="${i}" title="Remove">✕</button>
    </div>`).join("")}
  </div>` : `<div class="ulink-existing" id="ulink-list-${id}"></div>`;

  html += `<div class="drawer-section">
    <div class="drawer-section-label">🔗 My Links</div>
    ${ulinkItems}
    <div class="ulink-row">
      <input class="ulink-label-inp" id="ulink-label-${id}" placeholder="Label (optional)" />
      <input class="ulink-inp" id="ulink-url-${id}" type="url" placeholder="https://…" />
      <button class="ulink-add-btn" data-id="${id}">Add</button>
    </div>
  </div>`;

  document.getElementById("drawer-body").innerHTML = html;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-overlay").classList.add("open");
  document.body.style.overflow = "hidden";

  // Save note handler
  const noteBtn = document.getElementById(`drawer-note-btn-${id}`);
  noteBtn.addEventListener("click", () => {
    const val = document.getElementById(`drawer-note-${id}`).value;
    userNotes[id] = val;
    save();
    noteBtn.textContent = "Saved ✓";
    noteBtn.classList.add("saved");
    setTimeout(() => { noteBtn.textContent = "Save Note"; noteBtn.classList.remove("saved"); }, 1800);
  });

  // Add link handler
  document.querySelector(`.ulink-add-btn[data-id="${id}"]`).addEventListener("click", () => {
    const urlVal   = document.getElementById(`ulink-url-${id}`).value.trim();
    const labelVal = document.getElementById(`ulink-label-${id}`).value.trim();
    if (!urlVal) return;
    if (!userLinks[id]) userLinks[id] = [];
    userLinks[id].push({ label: labelVal || urlVal, url: urlVal });
    save();
    openDrawer(id); // re-render drawer with new link
  });

  // Delete link handlers
  document.querySelectorAll(`.ulink-del[data-id="${id}"]`).forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = +btn.dataset.idx;
      userLinks[id].splice(idx, 1);
      save();
      openDrawer(id);
    });
  });

}

// ── EDIT FORM ─────────────────────────────────────────────────────────────────
function showEditForm(id) {
  const item  = DATA.find(d => d.id === id);
  const edits = userEdits[id] || {};
  const name  = edits.name  ?? item.name;
  const note  = edits.note  ?? item.note  ?? "";
  const est   = edits.est   ?? item.est   ?? "";

  const form = document.createElement("div");
  form.id = "edit-form";
  form.className = "edit-form";
  form.innerHTML = `
    <div class="edit-field">
      <div class="edit-label">Task Name</div>
      <input class="edit-inp" id="edit-name" value="${name.replace(/"/g,'&quot;')}" />
    </div>
    <div class="edit-field">
      <div class="edit-label">Note / Description</div>
      <input class="edit-inp" id="edit-note" value="${note.replace(/"/g,'&quot;')}" placeholder="Add a note…" />
    </div>
    <div class="edit-field">
      <div class="edit-label">Estimated Cost ($)</div>
      <input class="edit-inp" id="edit-est" type="number" value="${est}" placeholder="0" />
    </div>
    <div class="edit-actions">
      <button class="edit-save" id="edit-save-btn">Save Changes</button>
      <button class="edit-cancel" id="edit-cancel-btn">Cancel</button>
    </div>`;

  const body = document.getElementById("drawer-body");
  body.insertBefore(form, body.firstChild);

  document.getElementById("edit-save-btn").addEventListener("click", () => {
    const n = document.getElementById("edit-name").value.trim();
    const o = document.getElementById("edit-note").value.trim();
    const e = parseFloat(document.getElementById("edit-est").value) || null;
    if (!n) return;
    userEdits[id] = { name: n, note: o, est: e };
    save();
    // Update drawer title live
    document.getElementById("drawer-title").textContent = n;
    // Flip edit button back
    const eb = document.getElementById("drawer-edit-btn");
    eb.textContent = "Edit"; eb.classList.remove("editing");
    removeEditForm();
    render(); // refresh list with new name/note/cost
  });
  document.getElementById("edit-cancel-btn").addEventListener("click", () => {
    const eb = document.getElementById("drawer-edit-btn");
    eb.textContent = "Edit"; eb.classList.remove("editing");
    removeEditForm();
  });
}

function removeEditForm() {
  const f = document.getElementById("edit-form");
  if (f) f.remove();
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer-overlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function attachBodyHandlers() {
  document.querySelectorAll(".item-body[data-id]").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.closest(".add-url") || e.target.closest(".url-link") || e.target.closest(".url-area")) return;
      const id = +el.dataset.id;
      if (DETAILS[id]) openDrawer(id);
    });
  });
}

render();
</script>
</body>
</html>
